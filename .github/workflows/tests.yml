name: Unity Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: write
jobs:
  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Delete old test artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = context.workflow;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '${{ github.workflow_ref }}'.split('@')[0].split('/').pop() || undefined,
            }).catch(() => null);

            let page = 1;
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              if (data.artifacts.length === 0) break;

              for (const artifact of data.artifacts) {
                if (
                  artifact.name === 'playmode-results' &&
                  artifact.workflow_run &&
                  artifact.workflow_run.id !== context.runId
                ) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                }
              }
              page++;
            }
            console.log(`Deleted ${deleted} old artifact(s)`);

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: playmode
          artifactsPath: playmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: playmode-artifacts

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PlayMode Test Report
          path: playmode-artifacts/**/*.xml
          reporter: dotnet-nunit